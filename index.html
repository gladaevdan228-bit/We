				/* Изначально полностью прячем секретный контент */

            				display: none; 
        		}

				font-size: 25px;

	</head>
	<body>

		<div id="auth-screen" class="box">
				<h1>Only for you<3 </h1>
				<p>Write our password :</p>
				<input type="password" id="password-input" placeholder="password:" >
				<br>
				<button onclick = "checkPassword()">To enter</button>
				<p id="error-message" style="color: red; display: none; font-weight: bold; margin-top: 10px;">
						You made wrong cinta, try again. Love you:)
				</p>
		</div>

		<div id="main-content" class="box" style="display: none;">
			<h1>
			<strong>I love you. And happy to say it &#128513; </strong> <br/>
			</h1>
				<p class="Love_cuz">
					<a href="Why.html" target="_blank">Why i m love you ?</a>
				</p>
				<h2>
						<a href="Yourdairy.html" target="_blank">How been your day?</a>
				</h2>

				<div style="margin: 25px 0;">
					<h3> Until i'm back:</h3>
					<div id="timer" class="timer-number">counting down the time</div>
				</div>
			
		</div>

<!-- 3. ЛОГИКА JAVASCRIPT -->

		<script>
			function checkPassword() {
				const input = document.getElementById('password-input').value;

				if (input === String.fromCharCode(109,101,110,99,105,110,116,97,105)) {
					document.getElementById("auth-screen").style.display = "none";
					document.getElementById("main-content").style.display = "inline-block"
					startTimer();
				}	else {
					document.getElementById("error-message").style.display = "block"
					}
			}

			 // Функция тикающего таймера

			function startTimer(){
				const targetDate = new Date(2027, 5, 30, 0, 0, 0 ).getTime();

				function updateTimer() {
					const now = new Date().getTime() //now time
					const diff = targetDate - now // late time

					// Переводим миллисекунды в дни, часы, минуты и секунды
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                if (diff > 0) {
                	document.getElementById("timer").innerHTML =  days + "d" +  hours  + "h" + minutes + "m" +  seconds + "s" ;  
                } else {// Если время вышло
                		document.getElementById("timer").innerHTML = " I m backkk ❤️" ;
                }
				
						}

			updateTimer();
			setInterval(updateTimer, 1000);
		}
		</script>


		
</body>
