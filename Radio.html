<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Radio Station Player</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; padding-bottom: 100px; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 25px; }
        
        /* Search Box */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 12px; border: 1px solid #334155; background: #1e293b; color: #fff; border-radius: 8px; font-size: 16px; outline: none; }
        .search-box input:focus { border-color: #38bdf8; }
        .search-box button { padding: 12px 24px; border: none; background: #38bdf8; color: #0f172a; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .search-box button:hover { background: #7dd3fc; }

        /* Quick Selection Tabs */
        .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px; }
        .tab-btn { padding: 8px 14px; border: none; background: #1e293b; color: #94a3b8; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .tab-btn:hover { background: #334155; color: #fff; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; }

        /* Station List */
        .station-list { display: flex; flex-direction: column; gap: 12px; }
        .station-card { display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.2s; border: 1px solid #334155; }
        .station-card:hover { background: #334155; border-color: #38bdf8; transform: translateY(-2px); }
        .station-info { flex: 1; min-width: 0; }
        .station-name { font-weight: bold; font-size: 16px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .station-tags { color: #94a3b8; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .play-icon { color: #38bdf8; font-size: 20px; padding-left: 10px; }

        /* Bottom Fixed Player Bar */
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top: 2px solid #38bdf8; padding: 15px; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 8px; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }
        .now-playing { font-size: 14px; color: #38bdf8; font-weight: bold; text-align: center; }
        audio { width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Global Radio Player</h2>
        <div class="subtitle">Search any country (e.g., Indonesia, Brazil) or music genre (e.g., Jazz, Anime)</div>
        
        <!-- SEARCH INPUT -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Type country or music style...">
            <button onclick="searchRadio()">Search</button>
        </div>

        <!-- QUICK TABS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="loadByCountry('JP', this)">🇯🇵 Japan</button>
            <button class="tab-btn" onclick="loadByCountry('CN', this)">🇨🇳 China</button>
            <button class="tab-btn" onclick="loadByCountry('KR', this)">🇰🇷 Korea</button>
            <button class="tab-btn" onclick="loadByCountry('US', this)">🇺🇸 USA</button>
            <button class="tab-btn" onclick="loadByCountry('FR', this)">🇫🇷 France</button>
        </div>

        <!-- STATIONS OUTPUT -->
        <div class="station-list" id="stations">Loading stations...</div>
    </div>

    <!-- PLAYER BAR -->
    <div class="player-bar" id="playerBar">
        <div class="now-playing" id="currentStationName">Now playing: </div>
        <audio id="radioAudio" controls></audio>
    </div>

    <script>
        // Стабильный базовый хост API
        const API_HOST = "https://radio-browser.info";

        // Запуск при старте страницы
        window.onload = () => {
            loadRadioData(`${API_HOST}bycountrycodeexact/JP?limit=15&order=clickcount&reverse=true`);
        };

        function loadByCountry(code, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('searchInput').value = ''; 
            
            loadRadioData(`${API_HOST}bycountrycodeexact/${code}?limit=15&order=clickcount&reverse=true`);
        }

        function searchRadio() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return alert('Please enter a search term!');

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            const url = `${API_HOST}byname/${encodeURIComponent(query)}?limit=15&order=clickcount&reverse=true`;
            loadRadioData(url);
        }

        // Глобальная функция-колбэк, которую вызовет сервер базы данных
        window.handleRadioResponse = function(stations) {
            const listContainer = document.getElementById('stations');
            listContainer.innerHTML = '';

            // Удаляем временный тег скрипта из документа, чтобы не засорять HTML
            const oldScript = document.getElementById('jsonp-script');
            if (oldScript) oldScript.remove();

            if (!stations || stations.length === 0) {
                listContainer.innerHTML = 'No stations found. Try searching with different keywords (e.g., Indonesia, Rock).';
                return;
            }

            stations.forEach(station => {
                if (!station.url_resolved) return;

                const card = document.createElement('div');
                card.className = 'station-card';
                card.onclick = () => playRadio(station.url_resolved, station.name);

                const tags = station.tags ? station.tags.split(',').slice(0, 4).join(', ') : 'radio';
                const country = station.country ? ` (${station.country})` : '';

                card.innerHTML = `
                    <div class="station-info">
                        <div class="station-name">${station.name}${country}</div>
                        <div class="station-tags">${tags}</div>
                    </div>
                    <div class="play-icon">▶</div>
                `;
                listContainer.appendChild(card);
            });
        };

        // Функция отправки JSONP запроса
        function loadRadioData(baseUrl) {
            const listContainer = document.getElementById('stations');
            listContainer.innerHTML = 'Searching stations...';

            // Добавляем к URL параметр callback, сообщающий серверу имя нашей функции обработки
            const jsonpUrl = baseUrl + (baseUrl.includes('?') ? '&' : '?') + 'callback=handleRadioResponse';

            // Создаем тег <script>, который браузер выполнит без ограничений CORS
            const script = document.createElement('script');
            script.src = jsonpUrl;
            script.id = 'jsonp-script';
            
            // Если скрипт не загрузился вовсе (проблема с интернетом)
            script.onerror = () => {
                listContainer.innerHTML = 'Connection error. Please check your network or try again.';
            };

            document.body.appendChild(script);
        }

        function playRadio(streamUrl, stationName) {
            const playerBar = document.getElementById('playerBar');
            const audio = document.getElementById('radioAudio');
            const title = document.getElementById('currentStationName');

            title.innerText = `Now playing: ${stationName}`;
            audio.src = streamUrl;
            
            playerBar.style.display = 'flex';
            audio.play().catch(error => {
                alert("This stream is temporary unavailable. Please try another station.");
            });
        }
    </script>
</body>
</html>
