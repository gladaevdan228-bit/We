<!DOCTYPE html>
<html lang="en">
	<head>
				<meta charset="utf-8">
				<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Our photo</title>
				<style>
								body{
									font-family: URW Chancery L, cursive;
									margin: 0;
								}
								
								h1   {
									color: #ff4d6d;
									font-size: 45px;
									margin-bottom: 25px;
									font-family: Brush Script Std, cursive;
								}

								.gallery {
									max-width: 500px;
									margin:  0 auto;
									padding: 10px;
									box-sizing: border-box;
								}

								.gallery img {
									width: 100%;
									height: auto;
									border-radius: 15px;
									box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
									margin-bottom: 25px;
									display: block;
								}

				</style>
	</head>

	<body>
				<h1>Our moment</h1>
				<div id="photo-gallery" class="gallery"></div>

				<script>
							const galleryBlock = document.getElementById("photo-gallery");
							let photoNumbers = [];

							for (let i = 1; i <= 12; i++){
								photoNumbers.push(i);
							}

							for (let i = 100; i <= 153; i++){
								photoNumbers.push(i);
							}

							for (let i = photoNumbers.length - 1; i > 0; i --){
								const j = Math.floor(Math.random() * (i + 1));
								const temp = photoNumbers[i];
								photoNumbers[i] = photoNumbers[j];
								photoNumbers[j] = temp
							}

							photoNumbers.forEach(function (number){ const img = document.createElement('img');

								img.src = "photos/photo" + number + ".jpeg"
								img.alt = "Our memory"
								img.loading = "lazy"
								galleryBlock.appendChild(img);
								})


				</script>
	</body>




</html>
